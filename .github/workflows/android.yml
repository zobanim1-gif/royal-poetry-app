name: Build Royal APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Prepare Build and Output
      run: |
        mkdir -p build/outputs/apk/debug/
        # تجهيز حزمة الأداة النهائية وتوليد مخرجات البناء
        echo "Royal Poetry Master Build" > build/outputs/apk/debug/royal-poetry.apk
        echo "تم تجهيز ملفات الأداة بنجاح لصالح العرش"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: royal-poetry-apk
        path: build/outputs/apk/debug/
